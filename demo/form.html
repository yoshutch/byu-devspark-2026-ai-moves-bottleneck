<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Request an Advisement Appointment</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #182230;
        background: #f4f7fb;
      }

      body {
        margin: 0;
        padding: 2rem 1rem;
      }

      main {
        max-width: 38rem;
        margin: 0 auto;
        padding: 2rem;
        background: white;
        border: 1px solid #dce3ec;
        border-radius: 0.75rem;
        box-shadow: 0 0.5rem 1.5rem rgb(24 34 48 / 8%);
      }

      h1 {
        margin-top: 0;
        font-size: 1.65rem;
      }

      p {
        line-height: 1.5;
      }

      .form-row {
        display: grid;
        gap: 0.4rem;
        margin: 1rem 0;
      }

      label {
        font-weight: 600;
      }

      input,
      select,
      button {
        box-sizing: border-box;
        width: 100%;
        padding: 0.7rem;
        font: inherit;
        border: 1px solid #aebaca;
        border-radius: 0.4rem;
      }

      button {
        margin-top: 0.5rem;
        color: white;
        background: #1261a0;
        border-color: #1261a0;
        cursor: pointer;
        font-weight: 700;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #result {
        margin-top: 1.25rem;
        padding: 1rem;
        white-space: pre-wrap;
        border-radius: 0.4rem;
      }

      #result.success {
        background: #e9f7ee;
        color: #14532d;
      }

      #result.error {
        background: #fff0f0;
        color: #8a1c1c;
      }

      .help {
        color: #526173;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Request an advisement appointment</h1>
      <p class="help">This demo form sends a request to the local advisement appointment API.</p>

      <form id="appointment-form" action="/advisement/appointments" method="post">
        <div class="form-row">
          <label for="student-id">Student ID</label>
          <input id="student-id" name="student_id" value="123456789" required />
        </div>

        <div class="form-row">
          <label for="advisor-id">Advisor ID</label>
          <input id="advisor-id" name="advisor_id" value="advisor-001" required />
        </div>

        <div class="form-row">
          <label for="starts-at">Start time</label>
          <input id="starts-at" name="starts_at" type="datetime-local" required />
          <span class="help">Your browser's local time is converted to RFC3339 for the API.</span>
        </div>

        <div class="form-row">
          <label for="token">Demo bearer token</label>
          <input id="token" name="token" value="demo-student" required />
          <span class="help">The default token can create appointments only for student 123456789.</span>
        </div>

        <button type="submit">Request appointment</button>
      </form>

      <div id="result" role="status" aria-live="polite" hidden></div>
    </main>

    <script>
      const form = document.querySelector("#appointment-form");
      const startsAt = document.querySelector("#starts-at");
      const result = document.querySelector("#result");
      const submitButton = form.querySelector("button[type=submit]");

      const defaultStart = new Date(Date.now() + 60 * 60 * 1000);
      defaultStart.setMinutes(0, 0, 0);
      startsAt.value = `${defaultStart.getFullYear()}-${String(defaultStart.getMonth() + 1).padStart(2, "0")}-${String(defaultStart.getDate()).padStart(2, "0")}T${String(defaultStart.getHours()).padStart(2, "0")}:00`;

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        result.hidden = true;
        result.className = "";
        submitButton.disabled = true;
        submitButton.textContent = "Submitting…";

        const data = new FormData(form);
        const appointment = {
          student_id: data.get("student_id").trim(),
          advisor_id: data.get("advisor_id").trim(),
          appointment_type: "academic_advising",
          starts_at: new Date(data.get("starts_at")).toISOString()
        };

        try {
          const response = await fetch(form.action, {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${data.get("token").trim()}`,
              "Content-Type": "application/json",
              "Idempotency-Key": window.crypto && window.crypto.randomUUID
                ? window.crypto.randomUUID()
                : `browser-${Date.now()}-${Math.random().toString(16).slice(2)}`
            },
            body: JSON.stringify(appointment)
          });
          const body = await response.json();

          result.hidden = false;
          result.className = response.ok ? "success" : "error";
          result.textContent = response.ok
            ? `Appointment requested successfully.\n\n${JSON.stringify(body, null, 2)}`
            : `${body.title || "Request failed"}: ${body.detail || "The API rejected the request."}`;
        } catch (error) {
          result.hidden = false;
          result.className = "error";
          result.textContent = `Could not reach the API: ${error.message}`;
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Request appointment";
        }
      });
    </script>
  </body>
</html>
